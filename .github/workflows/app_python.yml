name: Python Package CI

on:
  push:
    paths:
    - 'app_python/**'
    - '.github/workflows/app_python.yaml'
  pull_request:
    paths:
    - 'app_python/**'
    - '.github/workflows/app_python.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install python-dotenv
          pip install python-dateutil

      - name: Format with Black
        run: |
          pip install black
          black . --check --diff

      - name: Test with unittest
        run: |
          python -m unittest discover -s app_python/tests -t . -v

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/morozov_devops_webapp .
          docker push ${{ secrets.DOCKERHUB_PASSWORD }}/morozov_devops_webapp
